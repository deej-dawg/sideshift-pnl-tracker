<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SideShift P&L Tracker</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, 'Inter', sans-serif; background: #0d0d0f; color: #e4e4e7; min-height: 100vh; }
    input, textarea, select { font-family: inherit; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: #a78bfa !important; box-shadow: 0 0 0 3px rgba(167,139,250,0.15); }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

const PASSWORD = "daddydeej";
const STORAGE_KEY = "ss_pnl_v2";

const fmt = n => new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}).format(n||0);
const pct = n => isNaN(n)||!isFinite(n) ? "0.0%" : `${(+n).toFixed(1)}%`;
const num = v => parseFloat(v)||0;
const uid = () => Math.random().toString(36).slice(2,9);

const STATUS_COLORS = { Active:"#34d399", Complete:"#60a5fa", Paused:"#fbbf24", Cancelled:"#f87171" };

const newCampaign = () => ({
  id: uid(), name:"", client:"", status:"Active",
  revenue:"", creatorSpend:"", sparkSpend:"",
  findings:"", notes:"", future:"", improvements:""
});

function MetricCard({ label, value, sub, color="#a78bfa" }) {
  return (
    <div style={{ background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.07)", borderRadius:16, padding:"20px 24px", flex:1, minWidth:140, animation:"fadeIn .3s ease" }}>
      <div style={{ color:"#666", fontSize:11, fontWeight:600, letterSpacing:1, textTransform:"uppercase", marginBottom:8 }}>{label}</div>
      <div style={{ color, fontSize:26, fontWeight:700, lineHeight:1 }}>{value}</div>
      {sub && <div style={{ color:"#555", fontSize:12, marginTop:6 }}>{sub}</div>}
    </div>
  );
}

function InputField({ label, value, onChange, placeholder, type="text", area }) {
  const s = { width:"100%", background:"rgba(255,255,255,0.05)", border:"1px solid rgba(255,255,255,0.09)", borderRadius:10, padding:"10px 14px", color:"#e4e4e7", fontSize:14, transition:"border .2s, box-shadow .2s" };
  return (
    <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
      <label style={{ fontSize:11, fontWeight:600, color:"#666", textTransform:"uppercase", letterSpacing:.8 }}>{label}</label>
      {area
        ? <textarea value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} rows={3} style={{...s, resize:"vertical"}} />
        : <input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={s} />}
    </div>
  );
}

function CampaignCard({ c, onUpdate, onDelete }) {
  const [open, setOpen] = useState(false);
  const rev = num(c.revenue), cs = num(c.creatorSpend), ss = num(c.sparkSpend);
  const totalSpend = cs + ss, profit = rev - totalSpend;
  const margin = rev > 0 ? (profit/rev)*100 : 0;
  const marginColor = margin >= 40 ? "#34d399" : margin >= 20 ? "#fbbf24" : "#f87171";

  const set = (k,v) => onUpdate({...c,[k]:v});

  return (
    <div style={{ background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.07)", borderRadius:18, overflow:"hidden", animation:"fadeIn .3s ease" }}>
      {/* Header */}
      <div style={{ padding:"18px 24px", display:"flex", alignItems:"center", gap:16, cursor:"pointer" }} onClick={()=>setOpen(o=>!o)}>
        <div style={{ flex:1 }}>
          <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:4 }}>
            <span style={{ fontWeight:700, fontSize:16 }}>{c.name||"Untitled Campaign"}</span>
            <span style={{ background:STATUS_COLORS[c.status]+"22", color:STATUS_COLORS[c.status], fontSize:11, fontWeight:600, padding:"2px 10px", borderRadius:20 }}>{c.status}</span>
            {c.client && <span style={{ color:"#555", fontSize:13 }}>{c.client}</span>}
          </div>
          <div style={{ display:"flex", gap:20, fontSize:13, color:"#888" }}>
            <span>Rev: <b style={{color:"#e4e4e7"}}>{fmt(rev)}</b></span>
            <span>Spend: <b style={{color:"#f87171"}}>{fmt(totalSpend)}</b></span>
            <span>Profit: <b style={{color:profit>=0?"#34d399":"#f87171"}}>{fmt(profit)}</b></span>
            <span>Margin: <b style={{color:marginColor}}>{pct(margin)}</b></span>
          </div>
        </div>
        <div style={{ color:"#444", fontSize:20, transition:"transform .2s", transform:open?"rotate(180deg)":"none" }}>⌄</div>
      </div>

      {open && (
        <div style={{ padding:"0 24px 24px", display:"flex", flexDirection:"column", gap:20, borderTop:"1px solid rgba(255,255,255,0.06)" }}>
          {/* Basic Info */}
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:16, marginTop:20 }}>
            <InputField label="Campaign Name" value={c.name} onChange={v=>set("name",v)} placeholder="Q1 TikTok Push" />
            <InputField label="Client / Brand" value={c.client} onChange={v=>set("client",v)} placeholder="Nike" />
            <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
              <label style={{ fontSize:11, fontWeight:600, color:"#666", textTransform:"uppercase", letterSpacing:.8 }}>Status</label>
              <select value={c.status} onChange={e=>set("status",e.target.value)} style={{ background:"rgba(255,255,255,0.05)", border:"1px solid rgba(255,255,255,0.09)", borderRadius:10, padding:"10px 14px", color:"#e4e4e7", fontSize:14 }}>
                {Object.keys(STATUS_COLORS).map(s=><option key={s} value={s}>{s}</option>)}
              </select>
            </div>
          </div>

          {/* Financials */}
          <div style={{ background:"rgba(255,255,255,0.02)", borderRadius:14, padding:18 }}>
            <div style={{ fontSize:12, fontWeight:600, color:"#555", textTransform:"uppercase", letterSpacing:1, marginBottom:14 }}>Financials</div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:16 }}>
              <InputField label="Revenue ($)" type="number" value={c.revenue} onChange={v=>set("revenue",v)} placeholder="0" />
              <InputField label="Creator Spend ($)" type="number" value={c.creatorSpend} onChange={v=>set("creatorSpend",v)} placeholder="0" />
              <InputField label="Spark Spend ($)" type="number" value={c.sparkSpend} onChange={v=>set("sparkSpend",v)} placeholder="0" />
            </div>
            {/* Profit breakdown */}
            <div style={{ display:"flex", gap:16, marginTop:16 }}>
              {[["Total Spend", fmt(totalSpend), "#f87171"],["Profit", fmt(profit), profit>=0?"#34d399":"#f87171"],["Margin", pct(margin), marginColor]].map(([l,v,c])=>(
                <div key={l} style={{ flex:1, background:"rgba(255,255,255,0.03)", borderRadius:10, padding:"12px 16px" }}>
                  <div style={{ fontSize:11, color:"#555", textTransform:"uppercase", letterSpacing:.8, marginBottom:4 }}>{l}</div>
                  <div style={{ fontSize:20, fontWeight:700, color:c }}>{v}</div>
                </div>
              ))}
            </div>
          </div>

          {/* Notes */}
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:16 }}>
            <InputField label="Findings" area value={c.findings} onChange={v=>set("findings",v)} placeholder="What worked, what didn't..." />
            <InputField label="Notes" area value={c.notes} onChange={v=>set("notes",v)} placeholder="General notes..." />
            <InputField label="Future Plans" area value={c.future} onChange={v=>set("future",v)} placeholder="Next steps, upcoming..." />
            <InputField label="What to Do Better" area value={c.improvements} onChange={v=>set("improvements",v)} placeholder="Improvements for next time..." />
          </div>

          <button onClick={()=>onDelete(c.id)} style={{ alignSelf:"flex-end", background:"rgba(248,113,113,0.1)", border:"1px solid rgba(248,113,113,0.2)", borderRadius:8, padding:"8px 18px", color:"#f87171", cursor:"pointer", fontSize:13 }}>
            Delete Campaign
          </button>
        </div>
      )}
    </div>
  );
}

function Login({ onLogin }) {
  const [pw, setPw] = useState(""), [err, setErr] = useState(false);
  const submit = () => { if(pw===PASSWORD){ onLogin(); } else { setErr(true); setTimeout(()=>setErr(false),1500); } };
  return (
    <div style={{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", background:"#0d0d0f" }}>
      <div style={{ background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.08)", borderRadius:24, padding:48, width:360, textAlign:"center" }}>
        <div style={{ fontSize:32, marginBottom:8 }}>📊</div>
        <h1 style={{ fontSize:22, fontWeight:700, marginBottom:4 }}>SideShift P&L</h1>
        <p style={{ color:"#555", fontSize:14, marginBottom:28 }}>Enter password to access</p>
        <input type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}
          placeholder="Password" style={{ width:"100%", background:"rgba(255,255,255,0.06)", border:`1px solid ${err?"#f87171":"rgba(255,255,255,0.1)"}`, borderRadius:10, padding:"12px 16px", color:"#e4e4e7", fontSize:15, marginBottom:14, textAlign:"center", transition:"border .2s" }} />
        <button onClick={submit} style={{ width:"100%", background:"#a78bfa", border:"none", borderRadius:10, padding:"12px", color:"#fff", fontWeight:700, fontSize:15, cursor:"pointer" }}>
          Enter
        </button>
        {err && <p style={{ color:"#f87171", fontSize:13, marginTop:12 }}>Incorrect password</p>}
      </div>
    </div>
  );
}

function App() {
  const [authed, setAuthed] = useState(()=>sessionStorage.getItem("ss_auth")==="1");
  const [campaigns, setCampaigns] = useState(()=>{
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]"); } catch { return []; }
  });
  const [filter, setFilter] = useState("All");
  const [selected, setSelected] = useState(()=>new Set());

  useEffect(()=>{ localStorage.setItem(STORAGE_KEY, JSON.stringify(campaigns)); }, [campaigns]);

  const login = () => { sessionStorage.setItem("ss_auth","1"); setAuthed(true); };

  const addCampaign = () => setCampaigns(c=>[newCampaign(),...c]);
  const updateCampaign = (updated) => setCampaigns(c=>c.map(x=>x.id===updated.id?updated:x));
  const deleteCampaign = (id) => { if(confirm("Delete this campaign?")) setCampaigns(c=>c.filter(x=>x.id!==id)); };

  const filtered = filter==="All" ? campaigns : campaigns.filter(c=>c.status===filter);

  const toggleSelect = (id) => setSelected(s=>{ const n=new Set(s); n.has(id)?n.delete(id):n.add(id); return n; });
  const selectAll = () => setSelected(new Set(filtered.map(c=>c.id)));
  const clearAll = () => setSelected(new Set());

  const activeCampaigns = selected.size>0 ? campaigns.filter(c=>selected.has(c.id)) : campaigns;

  const totals = useMemo(()=>{
    const r = activeCampaigns.reduce((a,c)=>({
      rev: a.rev+num(c.revenue),
      cs: a.cs+num(c.creatorSpend),
      ss: a.ss+num(c.sparkSpend),
    }),{rev:0,cs:0,ss:0});
    const spend = r.cs+r.ss, profit = r.rev-spend;
    return { ...r, spend, profit, margin: r.rev>0?(profit/r.rev)*100:0 };
  },[campaigns]);

  if(!authed) return <Login onLogin={login} />;

  return (
    <div style={{ maxWidth:1100, margin:"0 auto", padding:"32px 24px" }}>
      {/* Header */}
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:32 }}>
        <div>
          <h1 style={{ fontSize:28, fontWeight:800, background:"linear-gradient(135deg,#a78bfa,#60a5fa)", WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent" }}>
            SideShift P&L
          </h1>
          <p style={{ color:"#555", fontSize:14, marginTop:2 }}>Campaign profitability dashboard</p>
        </div>
        <button onClick={addCampaign} style={{ background:"#a78bfa", border:"none", borderRadius:12, padding:"12px 22px", color:"#fff", fontWeight:700, fontSize:14, cursor:"pointer", display:"flex", alignItems:"center", gap:8 }}>
          + New Campaign
        </button>
      </div>

      {/* Book of Business Totals */}
      <div style={{ marginBottom:28 }}>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:14 }}>
          <div style={{ display:"flex", alignItems:"center", gap:10 }}>
            <div style={{ fontSize:11, fontWeight:600, color:"#444", textTransform:"uppercase", letterSpacing:1 }}>Book of Business</div>
            {selected.size>0 && (
              <span style={{ background:"rgba(167,139,250,0.15)", color:"#a78bfa", fontSize:11, fontWeight:600, padding:"2px 10px", borderRadius:20 }}>
                {selected.size} of {campaigns.length} selected
              </span>
            )}
          </div>
          {selected.size>0 && (
            <button onClick={clearAll} style={{ background:"transparent", border:"1px solid rgba(255,255,255,0.1)", borderRadius:8, padding:"5px 12px", color:"#666", fontSize:12, cursor:"pointer" }}>
              Clear selection
            </button>
          )}
        </div>
        <div style={{ display:"flex", gap:14, flexWrap:"wrap" }}>
          <MetricCard label="Total Revenue" value={fmt(totals.rev)} color="#a78bfa" />
          <MetricCard label="Total Spend" value={fmt(totals.spend)} sub={`Creator ${fmt(totals.cs)} · Spark ${fmt(totals.ss)}`} color="#f87171" />
          <MetricCard label="Total Profit" value={fmt(totals.profit)} color={totals.profit>=0?"#34d399":"#f87171"} />
          <MetricCard label="Overall Margin" value={pct(totals.margin)} color={totals.margin>=40?"#34d399":totals.margin>=20?"#fbbf24":"#f87171"} />
          <MetricCard label="Campaigns" value={activeCampaigns.length} color="#60a5fa" sub={selected.size>0?"custom selection":`${campaigns.filter(c=>c.status==="Active").length} active`} />
        </div>
      </div>

      {/* Filter + Select All */}
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:20 }}>
        <div style={{ display:"flex", gap:8 }}>
          {["All",...Object.keys(STATUS_COLORS)].map(s=>(
            <button key={s} onClick={()=>setFilter(s)} style={{ background:filter===s?"rgba(167,139,250,0.15)":"transparent", border:`1px solid ${filter===s?"#a78bfa":"rgba(255,255,255,0.08)"}`, borderRadius:20, padding:"6px 16px", color:filter===s?"#a78bfa":"#666", fontSize:13, cursor:"pointer", fontWeight:filter===s?600:400 }}>
              {s}
            </button>
          ))}
        </div>
        <button onClick={selectAll} style={{ background:"transparent", border:"1px solid rgba(255,255,255,0.1)", borderRadius:8, padding:"6px 14px", color:"#888", fontSize:12, cursor:"pointer" }}>
          Select All
        </button>
      </div>

      {/* Campaigns */}
      <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
        {filtered.length===0 && (
          <div style={{ textAlign:"center", padding:"60px 0", color:"#444" }}>
            <div style={{ fontSize:40, marginBottom:12 }}>📋</div>
            <div style={{ fontSize:16, marginBottom:6 }}>No campaigns yet</div>
            <div style={{ fontSize:13 }}>Click "+ New Campaign" to get started</div>
          </div>
        )}
        {filtered.map(c=>(
          <div key={c.id} style={{ display:"flex", alignItems:"flex-start", gap:12 }}>
            <div onClick={()=>toggleSelect(c.id)} style={{ marginTop:22, width:20, height:20, borderRadius:6, border:`2px solid ${selected.has(c.id)?"#a78bfa":"rgba(255,255,255,0.15)"}`, background:selected.has(c.id)?"#a78bfa":"transparent", cursor:"pointer", flexShrink:0, display:"flex", alignItems:"center", justifyContent:"center", transition:"all .15s" }}>
              {selected.has(c.id) && <span style={{ color:"#fff", fontSize:12, lineHeight:1 }}>✓</span>}
            </div>
            <div style={{ flex:1 }}>
              <CampaignCard c={c} onUpdate={updateCampaign} onDelete={deleteCampaign} />
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
